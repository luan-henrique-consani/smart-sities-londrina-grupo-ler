target-version = "py311"
line-length = 100
extend-exclude = [".venv", "node_modules", ".next"]

[lint]
select = ["E", "F", "I", "B", "UP"]

[lint.flake8-bugbear]
# Idioma do FastAPI: Depends(...) e Query(...) em valores padrão de parâmetros.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]
